<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Sign up — Profile</title>

  <style>
*{
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}
body{
    height: 100%;
    font-family: Inter,"Helvetica Neue", Arial;
}

.container{
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
     padding: 24px;
}
.card{
    width: 650px;
    height: 900px;
    background: #ffffff;
    border-radius: 12px;
    box-shadow: 0 8px 30px rgba(30,40,80,0.08);
    padding: 22px;
    border: 1px solid rgba(20,30,60,0.04);
}

.card-header{ 
    text-align: left; 
    margin-bottom: 45px;
}
.card-header h1{ 
    font-size: 35px;
    margin-bottom: 20px;
}
.abcde{
    margin: 6px 0 14px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;;
}
.btn{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    padding:10px 12px;
    border-radius:8px; 
    font-weight:800;;
    cursor:pointer; 
    border:0;
}
.sign_up_text{
    font-size: 20px;
}

.btn-google{
  width:100%;
  background: #fffcfc;
  border: 1px solid rgba(20,30,60,0.08);
  box-shadow: 0 2px 6px rgba(20,30,60,0.03);
  color:#1b2340;
  font-size:14px;
}

.g-icon{
  display:flex;
  width:36px;
  height:36px;
  align-items:center;
  justify-content:center;
  border-radius:6px;
  background-color: green;;
  color:#fff; font-weight:700;
}

.or{
    font-size:12px;
    color:grey;
    margin-top:30px;
    margin-bottom: 25px;
    font-size: 20px;
}

.signup-form{
    gap:10px; 
    margin-top:6px;
}
label{
    font-size:13px;
    color:#3b4550;
    margin-bottom:4px;
}

input[type="text"],
input[type="email"],
input[type="password"]{
  width:100%;
  padding:10px 12px;
  border-radius:8px;
  border:1px solid rgba(20,30,60,0.08);
  background: #fbfdff;
  font-size:14px;
  outline: none;
  transition: box-shadow .12s, border-color .12s;
}

input::placeholder {
    color:#9aa6b2; font-weight:500;
}

input:focus{
  border-color:#6b8cff;
  box-shadow: 0 6px 18px rgba(107,140,255,0.08);
}

.note {
    font-size:12px;
    color:#6b7280;
    margin-top:6px;
}

.btn-primary {
    width:100%;
    padding:12px;
    background: linear-gradient(90deg,#556bff,#6b8cff);
    color:#fff;
    border-radius:8px;
    border:0;
    margin-top:6px;
    font-weight:700;
    letter-spacing:0.2px;
}

.card-footer {
    margin-top:12px;
    text-align:center; }
.card-footer a {
    color:#556bff;
    text-decoration:none;
    font-weight:600; }
.card-footer a:hover {
    text-decoration:underline; }

    @media (max-width:420px) {
      .card {
        width: 100%;
        padding:18px;
        border-radius:10px; }
    }
  </style>
</head>

<body>
  <main class="container">
    <section class="card">

      <header class="card-header">
        <h1>Create your profile</h1>
        <p class="subtitle">Quick sign up — secure and simple</p>
      </header>

      <div class="abcde">
        <button class="btn btn-google" type="button">
          <span class="g-icon">G</span>
          <p class="sign_up_text">Sign up with Google</p>
        </button>
        <div class="or">or</div>
      </div>

      <form class="signup-form" action="#" method="post" autocomplete="on" novalidate>
        <label for="username">Username</label>
        <input id="username" name="username" type="text" required minlength="3" placeholder="e.g. alex99">

        <label for="email">Email</label>
        <input id="email" name="email" type="email" required placeholder="you@example.com">

        <label for="password">Create password</label>
        <input id="password" name="password" type="password" required minlength="8" placeholder="At least 8 characters">

        <label for="confirm">Confirm password</label>
        <input id="confirm" name="confirm" type="password" required minlength="8" placeholder="Repeat password">

        <div class="note">We’ll never ask for the password to your external accounts.</div>

        <button class="btn btn-primary" type="submit">Sign up</button>
      </form>

      <footer class="card-footer">
        <small>Already have an account? <a href="#">Log in</a></small>
      </footer>

    </section>
  </main>
</body>
</html>
